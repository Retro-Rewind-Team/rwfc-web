services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rr_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rr_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5092
      ConnectionStrings__DefaultConnection: Host=db;Database=rr_dev;Username=postgres;Password=postgres
      WfcSecret: key
    ports:
      - "127.0.0.1:5092:5092"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    environment:
      VITE_API_URL: http://localhost:5092/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
